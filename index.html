<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Kas Badminton</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { primary: '#10b981', secondary: '#3b82f6', dark: '#1f2937' }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- jsPDF & AutoTable untuk Laporan PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- ICONS (SVG) ---
        const Icons = {
            Dashboard: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>,
            Turnamen: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>,
            Mabar: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>,
            Drilling: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>,
            Export: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>,
            Settings: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>,
            Plus: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path></svg>,
            Close: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>,
            Trash: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>,
            Edit: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>,
        };

        // --- UTILS ---
        const formatIDR = (amount) => {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(amount);
        };
        const formatDate = (dateStr) => {
            const options = { day: 'numeric', month: 'long', year: 'numeric' };
            return new Date(dateStr).toLocaleDateString('id-ID', options);
        };
        const generateId = () => Math.random().toString(36).substr(2, 9);

        // --- MAIN APP COMPONENT ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('Dashboard');
            const [transactions, setTransactions] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            
            // Modals state
            const [isAddModalOpen, setIsAddModalOpen] = useState(false);
            const [isExportModalOpen, setIsExportModalOpen] = useState(false);
            const [isSettingsModalOpen, setIsSettingsModalOpen] = useState(false);
            const [toastMsg, setToastMsg] = useState('');
            const [editingTx, setEditingTx] = useState(null);
            const [txToDelete, setTxToDelete] = useState(null);

            // SteinHQ Config
            const [steinUrl, setSteinUrl] = useState(localStorage.getItem('steinhq_url') || '');

            const showToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(''), 3000);
            };

            // Load Data from Stein or LocalStorage
            useEffect(() => {
                fetchData();
            }, [steinUrl]);

            const fetchData = async () => {
                setIsLoading(true);
                if (steinUrl) {
                    try {
                        const response = await fetch(steinUrl);
                        if (!response.ok) throw new Error('Network response was not ok');
                        const data = await response.json();
                        // Filter out empty rows that Stein might return
                        const validData = data.filter(item => item.id && item.tanggal);
                        setTransactions(validData.map(d => ({
                            ...d,
                            nominal: parseInt(d.nominal, 10)
                        })));
                    } catch (error) {
                        console.error("Gagal mengambil data dari SteinHQ:", error);
                        showToast("Gagal mengambil data dari Database. Periksa URL.");
                        // Fallback local if failed
                        loadLocalData();
                    }
                } else {
                    loadLocalData();
                }
                setIsLoading(false);
            };

            const loadLocalData = () => {
                const localData = localStorage.getItem('badminton_transactions');
                if (localData) setTransactions(JSON.parse(localData));
                else setTransactions([]);
            };

            // Save Data (Add or Edit)
            const handleSaveTransaction = async (newTx, isEdit) => {
                if (isEdit) {
                    const updatedList = transactions.map(t => t.id === newTx.id ? newTx : t);
                    setTransactions(updatedList);
                    
                    if (steinUrl) {
                        try {
                            await fetch(steinUrl, {
                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ condition: { id: newTx.id }, set: newTx })
                            });
                            showToast("Data berhasil diubah di Database!");
                        } catch (error) {
                            console.error("Error updating SteinHQ", error);
                            showToast("Gagal mengubah ke Database online. Tersimpan lokal.");
                            localStorage.setItem('badminton_transactions', JSON.stringify(updatedList));
                        }
                    } else {
                        localStorage.setItem('badminton_transactions', JSON.stringify(updatedList));
                        showToast("Perubahan tersimpan lokal.");
                    }
                } else {
                    const txData = {
                        id: generateId(),
                        tanggal: newTx.tanggal,
                        kategori: newTx.kategori,
                        tipe: newTx.tipe,
                        nominal: newTx.nominal,
                        keterangan: newTx.keterangan
                    };

                    const updatedList = [txData, ...transactions];
                    setTransactions(updatedList);
                    
                    if (steinUrl) {
                        try {
                            await fetch(steinUrl, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify([txData])
                            });
                            showToast("Berhasil disimpan ke Database!");
                        } catch (error) {
                            console.error("Error saving to SteinHQ", error);
                            showToast("Gagal menyimpan ke Database online. Tersimpan lokal.");
                            localStorage.setItem('badminton_transactions', JSON.stringify(updatedList));
                        }
                    } else {
                        localStorage.setItem('badminton_transactions', JSON.stringify(updatedList));
                        showToast("Tersimpan secara lokal.");
                    }
                }
                setIsAddModalOpen(false);
                setEditingTx(null);
            };

            const openEditModal = (tx) => {
                setEditingTx(tx);
                setIsAddModalOpen(true);
            };

            const handleDelete = async (id) => {
                const updatedList = transactions.filter(t => t.id !== id);
                setTransactions(updatedList);
                
                if (steinUrl) {
                    try {
                        // SteinHQ Delete requires condition in body
                        await fetch(steinUrl, {
                            method: 'DELETE',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ condition: { id: id } })
                        });
                        showToast("Data dihapus!");
                    } catch (error) {
                        console.error("Error deleting from SteinHQ", error);
                        showToast("Gagal hapus dari Database online.");
                    }
                } else {
                    localStorage.setItem('badminton_transactions', JSON.stringify(updatedList));
                    showToast("Data dihapus (lokal).");
                }
                setTxToDelete(null);
            };

            // --- RENDERERS ---
            return (
                <div className="flex h-screen bg-gray-100 overflow-hidden">
                    {/* Sidebar Desktop */}
                    <aside className="hidden md:flex flex-col w-64 bg-white shadow-lg z-10">
                        <div className="flex items-center justify-center h-20 border-b border-gray-100">
                            <div className="flex items-center space-x-2 text-primary font-bold text-xl">
                                <span>SUKA NEPAK</span>
                            </div>
                        </div>
                        <nav className="flex-1 overflow-y-auto py-4">
                            <ul className="space-y-1">
                                {['Dashboard', 'Turnamen', 'Mabar', 'Drilling'].map(tab => (
                                    <li key={tab}>
                                        <button 
                                            onClick={() => setActiveTab(tab)}
                                            className={`w-full flex items-center px-6 py-3 text-left transition-colors duration-200 ${activeTab === tab ? 'bg-primary/10 text-primary border-r-4 border-primary font-semibold' : 'text-gray-600 hover:bg-gray-50 hover:text-primary'}`}
                                        >
                                            <span className="mr-3">{Icons[tab]()}</span>
                                            {tab === 'Mabar' ? 'Mabar (Kamis & Sabtu)' : tab}
                                        </button>
                                    </li>
                                ))}
                            </ul>
                            
                            <div className="px-6 py-4 mt-4 text-xs font-semibold text-gray-400 uppercase tracking-wider">Laporan & Alat</div>
                            <ul className="space-y-1">
                                <li>
                                    <button onClick={() => setIsExportModalOpen(true)} className="w-full flex items-center px-6 py-3 text-left text-gray-600 hover:bg-gray-50 hover:text-blue-600 transition-colors">
                                        <span className="mr-3">{Icons.Export()}</span> Export PDF
                                    </button>
                                </li>
                                <li>
                                    <button onClick={() => setIsSettingsModalOpen(true)} className="w-full flex items-center px-6 py-3 text-left text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition-colors">
                                        <span className="mr-3">{Icons.Settings()}</span> Konfigurasi DB
                                    </button>
                                </li>
                            </ul>
                        </nav>
                    </aside>

                    {/* Main Content */}
                    <div className="flex-1 flex flex-col h-screen overflow-hidden">
                        {/* Topbar Mobile */}
                        <header className="md:hidden flex items-center justify-between bg-white px-4 py-3 shadow-sm z-20">
                            <div className="font-bold text-lg text-primary flex items-center">🏸 SUKA NEPAK</div>
                            <div className="flex space-x-2">
                                <button onClick={() => setIsExportModalOpen(true)} className="p-2 text-gray-600 bg-gray-100 rounded-lg"><Icons.Export /></button>
                                <button onClick={() => setIsSettingsModalOpen(true)} className="p-2 text-gray-600 bg-gray-100 rounded-lg"><Icons.Settings /></button>
                            </div>
                        </header>

                        {/* Scrollable Content */}
                        <main className="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-4 md:p-8">
                            <div className="max-w-6xl mx-auto space-y-6 fade-in">
                                {isLoading ? (
                                    <div className="flex justify-center items-center h-64">
                                        <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-primary"></div>
                                    </div>
                                ) : (
                                    <>
                                        {activeTab === 'Dashboard' && <DashboardView data={transactions} />}
                                        {activeTab !== 'Dashboard' && (
                                            <CategoryView 
                                                category={activeTab === 'Mabar' ? 'Mabar' : activeTab} 
                                                title={activeTab === 'Mabar' ? 'Keuangan Mabar (Kamis & Sabtu)' : `Keuangan ${activeTab}`}
                                                data={transactions} 
                                                onAdd={() => { setEditingTx(null); setIsAddModalOpen(true); }}
                                                onEdit={openEditModal}
                                                onDelete={(tx) => setTxToDelete(tx)}
                                            />
                                        )}
                                    </>
                                )}
                            </div>
                        </main>

                        {/* Bottom Navigation Mobile */}
                        <nav className="md:hidden bg-white shadow-[0_-2px_10px_rgba(0,0,0,0.05)] border-t border-gray-100 flex justify-around p-2 z-20">
                            {['Dashboard', 'Turnamen', 'Mabar', 'Drilling'].map(tab => (
                                <button 
                                    key={tab} 
                                    onClick={() => setActiveTab(tab)}
                                    className={`flex flex-col items-center justify-center p-2 rounded-xl text-xs w-full transition-all ${activeTab === tab ? 'text-primary font-bold bg-primary/10' : 'text-gray-500'}`}
                                >
                                    <span className="mb-1">{Icons[tab]()}</span>
                                    {tab === 'Mabar' ? 'Mabar' : tab}
                                </button>
                            ))}
                        </nav>
                    </div>

                    {/* Modals */}
                    {isAddModalOpen && (
                        <AddTransactionModal 
                            category={activeTab === 'Dashboard' ? 'Turnamen' : (activeTab === 'Mabar' ? 'Mabar' : activeTab)} // default to Turnamen if on dashboard
                            onClose={() => { setIsAddModalOpen(false); setEditingTx(null); }} 
                            onSave={handleSaveTransaction} 
                            initialData={editingTx}
                        />
                    )}
                    
                    {isExportModalOpen && (
                        <ExportModal 
                            data={transactions}
                            onClose={() => setIsExportModalOpen(false)} 
                        />
                    )}

                    {isSettingsModalOpen && (
                        <SettingsModal 
                            currentUrl={steinUrl}
                            onSave={(url) => { setSteinUrl(url); localStorage.setItem('steinhq_url', url); setIsSettingsModalOpen(false); }}
                            onClose={() => setIsSettingsModalOpen(false)}
                        />
                    )}

                    {txToDelete && (
                        <ConfirmModal 
                            title="Hapus Transaksi"
                            message={`Yakin ingin menghapus transaksi "${txToDelete.keterangan}" sebesar ${formatIDR(txToDelete.nominal)}?`}
                            onConfirm={() => handleDelete(txToDelete.id)}
                            onClose={() => setTxToDelete(null)}
                        />
                    )}

                    {/* Toast */}
                    {toastMsg && (
                        <div className="fixed bottom-20 md:bottom-10 right-1/2 translate-x-1/2 md:translate-x-0 md:right-10 bg-gray-800 text-white px-6 py-3 rounded-xl shadow-2xl flex items-center space-x-3 z-50 animate-[fadeIn_0.3s_ease-out]">
                            <svg className="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>
                            <span>{toastMsg}</span>
                        </div>
                    )}
                </div>
            );
        };

        // --- DASHBOARD VIEW ---
        const DashboardView = ({ data }) => {
            const totals = useMemo(() => {
                let pemasukan = 0, pengeluaran = 0;
                data.forEach(t => {
                    if (t.tipe === 'Pemasukan') pemasukan += t.nominal;
                    else pengeluaran += t.nominal;
                });
                return { pemasukan, pengeluaran, saldo: pemasukan - pengeluaran };
            }, [data]);

            const summaryByCategory = useMemo(() => {
                const cats = ['Turnamen', 'Mabar', 'Drilling'];
                return cats.map(cat => {
                    let pem = 0, peng = 0;
                    data.filter(t => t.kategori === cat).forEach(t => {
                        if (t.tipe === 'Pemasukan') pem += t.nominal; else peng += t.nominal;
                    });
                    return { name: cat, saldo: pem - peng };
                });
            }, [data]);

            return (
                <div className="space-y-6">
                    <div>
                        <h2 className="text-2xl font-bold text-gray-800">Keseluruhan Uang Kas</h2>
                        <p className="text-gray-500 text-sm">Akumulasi dari Turnamen, Mabar, dan Drilling.</p>
                    </div>

                    {/* Main Cards */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div className="bg-gradient-to-br from-primary to-green-600 p-6 rounded-2xl shadow-lg text-white">
                            <h3 className="text-green-100 font-medium text-sm mb-1">Total Saldo Kas Saat Ini</h3>
                            <div className="text-3xl font-bold tracking-tight">{formatIDR(totals.saldo)}</div>
                        </div>
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                            <div className="flex items-center space-x-3 mb-2">
                                <div className="p-2 bg-blue-50 text-blue-600 rounded-lg"><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg></div>
                                <h3 className="text-gray-500 font-medium text-sm">Total Pemasukan</h3>
                            </div>
                            <div className="text-2xl font-bold text-gray-800">{formatIDR(totals.pemasukan)}</div>
                        </div>
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                            <div className="flex items-center space-x-3 mb-2">
                                <div className="p-2 bg-red-50 text-red-600 rounded-lg"><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg></div>
                                <h3 className="text-gray-500 font-medium text-sm">Total Pengeluaran</h3>
                            </div>
                            <div className="text-2xl font-bold text-gray-800">{formatIDR(totals.pengeluaran)}</div>
                        </div>
                    </div>

                    {/* Breakdown per kategori */}
                    <h3 className="text-lg font-bold text-gray-800 mt-8 mb-4">Rincian Saldo per Kategori</h3>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        {summaryByCategory.map((cat, idx) => (
                            <div key={idx} className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center">
                                <div className="flex items-center space-x-3">
                                    <div className="text-primary">{Icons[cat.name]()}</div>
                                    <span className="font-semibold text-gray-700">{cat.name === 'Mabar' ? 'Mabar Rutin' : cat.name}</span>
                                </div>
                                <span className={`font-bold ${cat.saldo >= 0 ? 'text-green-600' : 'text-red-600'}`}>
                                    {formatIDR(cat.saldo)}
                                </span>
                            </div>
                        ))}
                    </div>

                    {/* Recent Transactions */}
                    <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden mt-8">
                        <div className="px-6 py-4 border-b border-gray-100 flex justify-between items-center">
                            <h3 className="font-bold text-gray-800">Transaksi Terakhir (Semua)</h3>
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-sm text-gray-500">
                                <thead className="bg-gray-50 text-gray-700 uppercase">
                                    <tr>
                                        <th className="px-6 py-3 font-medium">Tanggal</th>
                                        <th className="px-6 py-3 font-medium">Kategori</th>
                                        <th className="px-6 py-3 font-medium">Keterangan</th>
                                        <th className="px-6 py-3 font-medium text-right">Nominal</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {data.length === 0 ? (
                                        <tr><td colSpan="4" className="px-6 py-8 text-center text-gray-400">Belum ada data transaksi.</td></tr>
                                    ) : data.slice(0, 10).map((t, idx) => (
                                        <tr key={idx} className="border-b border-gray-50 hover:bg-gray-50">
                                            <td className="px-6 py-4 whitespace-nowrap">{formatDate(t.tanggal)}</td>
                                            <td className="px-6 py-4"><span className="px-2 py-1 bg-gray-100 rounded-md text-xs font-medium text-gray-600">{t.kategori}</span></td>
                                            <td className="px-6 py-4">{t.keterangan}</td>
                                            <td className={`px-6 py-4 text-right font-semibold ${t.tipe === 'Pemasukan' ? 'text-green-600' : 'text-red-600'}`}>
                                                {t.tipe === 'Pemasukan' ? '+' : '-'}{formatIDR(t.nominal)}
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        // --- CATEGORY VIEW ---
        const CategoryView = ({ category, title, data, onAdd, onEdit, onDelete }) => {
            const categoryData = useMemo(() => {
                return data.filter(t => t.kategori === category).sort((a,b) => new Date(b.tanggal) - new Date(a.tanggal));
            }, [data, category]);

            const totals = useMemo(() => {
                let pemasukan = 0, pengeluaran = 0;
                categoryData.forEach(t => {
                    if (t.tipe === 'Pemasukan') pemasukan += t.nominal;
                    else pengeluaran += t.nominal;
                });
                return { pemasukan, pengeluaran, saldo: pemasukan - pengeluaran };
            }, [categoryData]);

            // Hitung Saldo Global untuk sinkronisasi antar panel
            const globalSaldo = useMemo(() => {
                let pem = 0, peng = 0;
                data.forEach(t => {
                    if (t.tipe === 'Pemasukan') pem += t.nominal;
                    else peng += t.nominal;
                });
                return pem - peng;
            }, [data]);

            return (
                <div className="space-y-6 fade-in">
                    <div className="flex flex-col md:flex-row justify-between md:items-center gap-4">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800">{title}</h2>
                            <p className="text-gray-500 text-sm">Pencatatan khusus untuk keperluan {category.toLowerCase()}.</p>
                        </div>
                        <button onClick={onAdd} className="flex items-center justify-center space-x-2 bg-primary hover:bg-green-600 text-white px-5 py-2.5 rounded-xl font-medium transition-colors shadow-sm">
                            <Icons.Plus /> <span>Catat Transaksi</span>
                        </button>
                    </div>

                    {/* Summary Cards */}
                    <div className="grid grid-cols-3 gap-2 md:gap-4">
                        <div className="bg-white p-3 md:p-5 rounded-2xl shadow-sm border border-gray-100 text-center">
                            <div className="text-xs md:text-sm text-gray-500 mb-1">Total Pemasukan</div>
                            <div className="text-sm md:text-xl font-bold text-blue-600">{formatIDR(totals.pemasukan)}</div>
                        </div>
                        <div className="bg-white p-3 md:p-5 rounded-2xl shadow-sm border border-gray-100 text-center">
                            <div className="text-xs md:text-sm text-gray-500 mb-1">Total Pengeluaran</div>
                            <div className="text-sm md:text-xl font-bold text-red-600">{formatIDR(totals.pengeluaran)}</div>
                        </div>
                        <div className="bg-primary/10 p-3 md:p-5 rounded-2xl shadow-sm border border-primary/20 text-center">
                            <div className="text-xs md:text-sm text-primary font-medium mb-1">Saldo Kas (Semua)</div>
                            <div className="text-sm md:text-xl font-bold text-primary">{formatIDR(globalSaldo)}</div>
                        </div>
                    </div>

                    {/* Table */}
                    <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                        <div className="overflow-x-auto hide-scrollbar">
                            <table className="w-full text-left text-sm text-gray-500">
                                <thead className="bg-gray-50 text-gray-700 uppercase">
                                    <tr>
                                        <th className="px-6 py-4 font-medium whitespace-nowrap">Tanggal</th>
                                        <th className="px-6 py-4 font-medium">Keterangan</th>
                                        <th className="px-6 py-4 font-medium text-right whitespace-nowrap">Masuk</th>
                                        <th className="px-6 py-4 font-medium text-right whitespace-nowrap">Keluar</th>
                                        <th className="px-6 py-4 font-medium text-center">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {categoryData.length === 0 ? (
                                        <tr><td colSpan="5" className="px-6 py-12 text-center text-gray-400">Belum ada transaksi di kategori ini.</td></tr>
                                    ) : categoryData.map((t) => (
                                        <tr key={t.id} className="border-b border-gray-50 hover:bg-gray-50 transition-colors">
                                            <td className="px-6 py-4 whitespace-nowrap">{formatDate(t.tanggal)}</td>
                                            <td className="px-6 py-4 text-gray-700">{t.keterangan}</td>
                                            <td className="px-6 py-4 text-right font-semibold text-blue-600 whitespace-nowrap">
                                                {t.tipe === 'Pemasukan' ? formatIDR(t.nominal) : '-'}
                                            </td>
                                            <td className="px-6 py-4 text-right font-semibold text-red-600 whitespace-nowrap">
                                                {t.tipe === 'Pengeluaran' ? formatIDR(t.nominal) : '-'}
                                            </td>
                                            <td className="px-6 py-4 text-center">
                                                <div className="flex justify-center items-center space-x-2">
                                                    <button onClick={() => onEdit(t)} className="text-blue-400 hover:text-blue-600 p-1 bg-blue-50 rounded-md" title="Edit Transaksi">
                                                        <Icons.Edit />
                                                    </button>
                                                    <button onClick={() => onDelete(t)} className="text-red-400 hover:text-red-600 p-1 bg-red-50 rounded-md" title="Hapus Transaksi">
                                                        <Icons.Trash />
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        // --- ADD TRANSACTION MODAL ---
        const AddTransactionModal = ({ category, onClose, onSave, initialData }) => {
            const [formData, setFormData] = useState(initialData || {
                tanggal: new Date().toISOString().split('T')[0],
                kategori: category,
                tipe: 'Pemasukan',
                nominal: '',
                keterangan: ''
            });
            const [error, setError] = useState('');

            const isEditMode = !!initialData;

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!formData.nominal || formData.nominal <= 0) {
                    setError("Nominal harus diisi dengan benar.");
                    return;
                }
                if (!formData.keterangan) {
                    setError("Keterangan harus diisi.");
                    return;
                }
                setError('');
                onSave({ ...formData, nominal: parseInt(formData.nominal, 10) }, isEditMode);
            };

            return (
                <div className="fixed inset-0 bg-gray-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4 fade-in">
                    <div className="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden">
                        <div className="flex justify-between items-center px-6 py-4 border-b border-gray-100">
                            <h3 className="font-bold text-lg text-gray-800">{isEditMode ? 'Edit Transaksi' : 'Catat Transaksi Baru'}</h3>
                            <button onClick={onClose} className="text-gray-400 hover:text-gray-600"><Icons.Close /></button>
                        </div>
                        <form onSubmit={handleSubmit} className="p-6 space-y-4">
                            {error && <div className="p-3 bg-red-50 text-red-600 border border-red-200 rounded-lg text-sm">{error}</div>}
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Tipe Transaksi</label>
                                <div className="grid grid-cols-2 gap-3">
                                    <button type="button" onClick={() => setFormData({...formData, tipe: 'Pemasukan'})} className={`py-2 rounded-lg border font-medium text-sm transition-all ${formData.tipe === 'Pemasukan' ? 'border-blue-500 bg-blue-50 text-blue-700' : 'border-gray-200 text-gray-500 hover:bg-gray-50'}`}>Pemasukan</button>
                                    <button type="button" onClick={() => setFormData({...formData, tipe: 'Pengeluaran'})} className={`py-2 rounded-lg border font-medium text-sm transition-all ${formData.tipe === 'Pengeluaran' ? 'border-red-500 bg-red-50 text-red-700' : 'border-gray-200 text-gray-500 hover:bg-gray-50'}`}>Pengeluaran</button>
                                </div>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Kategori</label>
                                <select value={formData.kategori} onChange={(e) => setFormData({...formData, kategori: e.target.value})} className="w-full border border-gray-200 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-primary focus:border-primary outline-none">
                                    <option value="Turnamen">Turnamen</option>
                                    <option value="Mabar">Mabar (Kamis & Sabtu)</option>
                                    <option value="Drilling">Drilling</option>
                                </select>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Tanggal</label>
                                <input type="date" required value={formData.tanggal} onChange={(e) => setFormData({...formData, tanggal: e.target.value})} className="w-full border border-gray-200 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-primary focus:border-primary outline-none"/>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Keterangan</label>
                                <input type="text" required placeholder="Contoh: Beli kok 2 slop / Bayar gor" value={formData.keterangan} onChange={(e) => setFormData({...formData, keterangan: e.target.value})} className="w-full border border-gray-200 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-primary focus:border-primary outline-none"/>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Nominal (Rp)</label>
                                <input type="number" required placeholder="50000" value={formData.nominal} onChange={(e) => setFormData({...formData, nominal: e.target.value})} className="w-full border border-gray-200 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-primary focus:border-primary outline-none"/>
                            </div>
                            <div className="pt-2">
                                <button type="submit" className="w-full bg-primary hover:bg-green-600 text-white font-semibold py-3 rounded-xl transition-colors">
                                    {isEditMode ? 'Simpan Perubahan' : 'Simpan Transaksi'}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        // --- EXPORT MODAL ---
        const ExportModal = ({ data, onClose }) => {
            const [rangeType, setRangeType] = useState('Harian');
            const [customStart, setCustomStart] = useState('');
            const [customEnd, setCustomEnd] = useState('');
            const [error, setError] = useState('');

            const getToday = () => new Date().toISOString().split('T')[0];
            const getStartOfWeek = () => {
                const d = new Date();
                const day = d.getDay() || 7; 
                if(day !== 1) d.setHours(-24 * (day - 1)); 
                return d.toISOString().split('T')[0];
            };
            const getStartOfMonth = () => {
                const d = new Date();
                return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2, '0')}-01`;
            };

            const handleExport = () => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                
                let filteredData = [...data];
                let titlePeriode = "";
                const today = getToday();

                if (rangeType === 'Harian') {
                    filteredData = data.filter(t => t.tanggal === today);
                    titlePeriode = `Periode: ${formatDate(today)}`;
                } else if (rangeType === 'Mingguan') {
                    const start = getStartOfWeek();
                    filteredData = data.filter(t => t.tanggal >= start && t.tanggal <= today);
                    titlePeriode = `Periode: ${formatDate(start)} s/d ${formatDate(today)}`;
                } else if (rangeType === 'Bulanan') {
                    const start = getStartOfMonth();
                    filteredData = data.filter(t => t.tanggal >= start && t.tanggal <= today);
                    titlePeriode = `Bulan: ${new Date().toLocaleDateString('id-ID', { month: 'long', year: 'numeric' })}`;
                } else if (rangeType === 'Custom') {
                    if(!customStart || !customEnd) {
                        setError("Pilih tanggal mulai dan akhir.");
                        return;
                    }
                    filteredData = data.filter(t => t.tanggal >= customStart && t.tanggal <= customEnd);
                    titlePeriode = `Periode: ${formatDate(customStart)} s/d ${formatDate(customEnd)}`;
                }

                // Sort ascending date for report
                filteredData.sort((a, b) => new Date(a.tanggal) - new Date(b.tanggal));

                let totalPemasukan = 0, totalPengeluaran = 0;
                
                const tableBody = filteredData.map(t => {
                    if(t.tipe === 'Pemasukan') totalPemasukan += t.nominal;
                    else totalPengeluaran += t.nominal;
                    
                    return [
                        formatDate(t.tanggal),
                        t.kategori,
                        t.keterangan,
                        t.tipe === 'Pemasukan' ? formatIDR(t.nominal) : '-',
                        t.tipe === 'Pengeluaran' ? formatIDR(t.nominal) : '-'
                    ];
                });

                // PDF Headers
                doc.setFontSize(16);
                doc.text("Laporan Keuangan Uang Kas Badminton", 14, 15);
                doc.setFontSize(10);
                doc.setTextColor(100);
                doc.text(titlePeriode, 14, 22);

                doc.autoTable({
                    startY: 28,
                    head: [['Tanggal', 'Kategori', 'Keterangan', 'Pemasukan', 'Pengeluaran']],
                    body: tableBody,
                    foot: [
                        [{ content: 'Total', colSpan: 3, styles: { halign: 'right', fontStyle: 'bold' } }, 
                         { content: formatIDR(totalPemasukan), styles: { fontStyle: 'bold', textColor: [0, 150, 0] } },
                         { content: formatIDR(totalPengeluaran), styles: { fontStyle: 'bold', textColor: [200, 0, 0] } }
                        ],
                        [{ content: 'Saldo Tersisa', colSpan: 3, styles: { halign: 'right', fontStyle: 'bold' } }, 
                         { content: formatIDR(totalPemasukan - totalPengeluaran), colSpan: 2, styles: { fontStyle: 'bold', halign: 'center' } }
                        ]
                    ],
                    theme: 'grid',
                    headStyles: { fillColor: [16, 185, 129] },
                    styles: { fontSize: 9 }
                });

                doc.save(`Laporan_Kas_${rangeType}_${getToday()}.pdf`);
                onClose();
            };

            return (
                <div className="fixed inset-0 bg-gray-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4 fade-in">
                    <div className="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden">
                        <div className="flex justify-between items-center px-6 py-4 border-b border-gray-100">
                            <h3 className="font-bold text-lg text-gray-800">Export Laporan (PDF)</h3>
                            <button onClick={onClose} className="text-gray-400 hover:text-gray-600"><Icons.Close /></button>
                        </div>
                        <div className="p-6 space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">Pilih Jangka Waktu</label>
                                <div className="grid grid-cols-2 gap-2">
                                    {['Harian', 'Mingguan', 'Bulanan', 'Custom'].map(type => (
                                        <button 
                                            key={type}
                                            onClick={() => { setRangeType(type); setError(''); }} 
                                            className={`py-2 rounded-lg border font-medium text-sm transition-all ${rangeType === type ? 'border-primary bg-primary/10 text-primary' : 'border-gray-200 text-gray-500 hover:bg-gray-50'}`}
                                        >
                                            {type}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {error && <div className="text-red-500 text-sm">{error}</div>}

                            {rangeType === 'Custom' && (
                                <div className="grid grid-cols-2 gap-4 mt-4 p-4 bg-gray-50 rounded-xl border border-gray-100">
                                    <div>
                                        <label className="block text-xs font-medium text-gray-500 mb-1">Mulai Dari</label>
                                        <input type="date" value={customStart} onChange={e => setCustomStart(e.target.value)} className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none"/>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-medium text-gray-500 mb-1">Sampai Dengan</label>
                                        <input type="date" value={customEnd} onChange={e => setCustomEnd(e.target.value)} className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none"/>
                                    </div>
                                </div>
                            )}

                            <div className="pt-4">
                                <button onClick={handleExport} className="w-full flex items-center justify-center space-x-2 bg-gray-800 hover:bg-gray-900 text-white font-semibold py-3 rounded-xl transition-colors">
                                    <Icons.Export /> <span>Download PDF</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- CONFIRM MODAL ---
        const ConfirmModal = ({ title, message, onConfirm, onClose }) => {
            return (
                <div className="fixed inset-0 bg-gray-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4 fade-in">
                    <div className="bg-white rounded-2xl shadow-xl w-full max-w-sm overflow-hidden text-center p-6 space-y-4">
                        <div className="w-16 h-16 bg-red-50 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4 border border-red-100 shadow-sm">
                            <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </div>
                        <h3 className="font-bold text-xl text-gray-800">{title}</h3>
                        <p className="text-gray-500 text-sm px-2">{message}</p>
                        <div className="grid grid-cols-2 gap-3 pt-4">
                            <button onClick={onClose} className="py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium rounded-xl transition-colors">Batal</button>
                            <button onClick={onConfirm} className="py-2.5 bg-red-500 hover:bg-red-600 text-white font-medium rounded-xl transition-colors shadow-md">Ya, Hapus</button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- SETTINGS MODAL (STEIN HQ) ---
        const SettingsModal = ({ currentUrl, onSave, onClose }) => {
            const [url, setUrl] = useState(currentUrl);

            return (
                <div className="fixed inset-0 bg-gray-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4 fade-in">
                    <div className="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden max-h-[90vh] flex flex-col">
                        <div className="flex justify-between items-center px-6 py-4 border-b border-gray-100">
                            <h3 className="font-bold text-lg text-gray-800">Konfigurasi Database (SteinHQ)</h3>
                            <button onClick={onClose} className="text-gray-400 hover:text-gray-600"><Icons.Close /></button>
                        </div>
                        <div className="p-6 overflow-y-auto space-y-4 text-sm">
                            <div className="bg-blue-50 text-blue-800 p-4 rounded-xl border border-blue-100">
                                <p className="font-semibold mb-2">💡 Cara menghubungkan Google Sheets:</p>
                                <ol className="list-decimal pl-5 space-y-1">
                                    <li>Buat Google Sheets baru. Beri nama sheet <strong>(Bebas)</strong>.</li>
                                    <li>Buat Header persis seperti ini di baris pertama (A1 - F1): <br/>
                                        <code className="bg-white px-2 py-0.5 rounded text-blue-600 font-bold border mt-1 inline-block">id | tanggal | kategori | tipe | nominal | keterangan</code>
                                    </li>
                                    <li>Buka <strong>steinhq.com</strong>, login dan buat API dari spreadsheet Anda.</li>
                                    <li>Salin URL API (berakhiran `/Nama Sheet`) dan tempel di bawah.</li>
                                </ol>
                            </div>
                            <div>
                                <label className="block font-medium text-gray-700 mb-1">SteinHQ API URL</label>
                                <input 
                                    type="url" 
                                    placeholder="https://api.steinhq.com/v1/storages/YOUR_API_ID/Sheet1" 
                                    value={url} 
                                    onChange={(e) => setUrl(e.target.value)} 
                                    className="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-primary focus:border-primary outline-none"
                                />
                                <p className="text-xs text-gray-500 mt-2">Biarkan kosong untuk menggunakan mode lokal (Local Storage browser). Cocok untuk mencoba fitur terlebih dahulu.</p>
                            </div>
                        </div>
                        <div className="px-6 py-4 border-t border-gray-100 bg-gray-50">
                            <button onClick={() => onSave(url)} className="w-full bg-primary hover:bg-green-600 text-white font-semibold py-3 rounded-xl transition-colors">
                                Simpan Konfigurasi
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
