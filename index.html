<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Kas Badminton - Supabase Edition</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { primary: '#10b981', secondary: '#3b82f6', dark: '#1f2937' }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- jsPDF & AutoTable untuk Laporan PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .fade-in { animation: fadeIn 0.25s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- ICONS (SVG) ---
        const Icons = {
            Dashboard: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>,
            Turnamen: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>,
            Mabar: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>,
            Drilling: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>,
            Export: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>,
            Settings: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>,
            Plus: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path></svg>,
            Close: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>,
            Trash: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>,
            Edit: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>,
            Search: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>,
            ChevronLeft: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7"></path></svg>,
            ChevronRight: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"></path></svg>,
            Filter: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>,
            Refresh: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>,
            Database: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path></svg>
        };

        // --- UTILS ---
        const formatIDR = (amount) => {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(amount || 0);
        };

        const formatDate = (dateStr) => {
            if (!dateStr) return '-';
            const options = { day: 'numeric', month: 'short', year: 'numeric' };
            return new Date(dateStr).toLocaleDateString('id-ID', options);
        };

        const generateId = () => typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID() : 'id_' + Math.random().toString(36).substr(2, 9);

        // Helper Supabase Client setup
        const getSupabaseClient = (url, key) => {
            if (url && key && window.supabase) {
                try {
                    return window.supabase.createClient(url, key);
                } catch (e) {
                    console.error("Gagal inisialisasi Supabase client:", e);
                    return null;
                }
            }
            return null;
        };

        // --- MAIN APP COMPONENT ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('Dashboard');
            const [transactions, setTransactions] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            
            // Supabase Credentials State
            const [supabaseUrl, setSupabaseUrl] = useState(localStorage.getItem('supabase_url') || '');
            const [supabaseKey, setSupabaseKey] = useState(localStorage.getItem('supabase_key') || '');
            const [supabaseClient, setSupabaseClient] = useState(null);

            // Modals & Notif State
            const [isAddModalOpen, setIsAddModalOpen] = useState(false);
            const [isExportModalOpen, setIsExportModalOpen] = useState(false);
            const [isSettingsModalOpen, setIsSettingsModalOpen] = useState(false);
            const [toastMsg, setToastMsg] = useState('');
            const [editingTx, setEditingTx] = useState(null);
            const [txToDelete, setTxToDelete] = useState(null);

            const showToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(''), 3500);
            };

            // Init Supabase client
            useEffect(() => {
                const client = getSupabaseClient(supabaseUrl, supabaseKey);
                setSupabaseClient(client);
            }, [supabaseUrl, supabaseKey]);

            // Fetch data when Client or URL changes
            useEffect(() => {
                fetchData();
            }, [supabaseClient]);

            const fetchData = async () => {
                setIsLoading(true);
                if (supabaseClient) {
                    try {
                        const { data, error } = await supabaseClient
                            .from('transactions')
                            .select('*')
                            .order('tanggal', { ascending: false });

                        if (error) throw error;

                        setTransactions((data || []).map(item => ({
                            ...item,
                            nominal: Number(item.nominal)
                        })));
                    } catch (error) {
                        console.error("Gagal mengambil data dari Supabase:", error);
                        showToast("Gagal terhubung ke Supabase. Menggunakan data lokal.");
                        loadLocalData();
                    }
                } else {
                    loadLocalData();
                }
                setIsLoading(false);
            };

            const loadLocalData = () => {
                const localData = localStorage.getItem('badminton_transactions');
                if (localData) {
                    setTransactions(JSON.parse(localData));
                } else {
                    // Pre-fill demo data if empty
                    const demoData = [
                        { id: '1', tanggal: '2026-03-01', kategori: 'Mabar', tipe: 'Pemasukan', nominal: 150000, keterangan: 'Iuran mabar member Sabtu' },
                        { id: '2', tanggal: '2026-03-01', kategori: 'Mabar', tipe: 'Pengeluaran', nominal: 80000, keterangan: 'Sewa lapangan Gor 2 jam' },
                        { id: '3', tanggal: '2026-03-05', kategori: 'Drilling', tipe: 'Pemasukan', nominal: 100000, keterangan: 'Uang pendaftaran drilling pekan 1' },
                        { id: '4', tanggal: '2026-03-05', kategori: 'Drilling', tipe: 'Pengeluaran', nominal: 65000, keterangan: 'Beli 1 slop kok Victor' },
                        { id: '5', tanggal: '2026-03-10', kategori: 'Turnamen', tipe: 'Pemasukan', nominal: 500000, keterangan: 'Sponsorship toko olahraga' },
                        { id: '6', tanggal: '2026-03-10', kategori: 'Turnamen', tipe: 'Pengeluaran', nominal: 250000, keterangan: 'DP Pendaftaran Turnamen Inter-Club' }
                    ];
                    setTransactions(demoData);
                    localStorage.setItem('badminton_transactions', JSON.stringify(demoData));
                }
            };

            // Save Data (Add or Edit)
            const handleSaveTransaction = async (txData, isEdit) => {
                let updatedList;
                if (isEdit) {
                    updatedList = transactions.map(t => t.id === txData.id ? txData : t);
                    setTransactions(updatedList);

                    if (supabaseClient) {
                        try {
                            const { error } = await supabaseClient
                                .from('transactions')
                                .update({
                                    tanggal: txData.tanggal,
                                    kategori: txData.kategori,
                                    tipe: txData.tipe,
                                    nominal: txData.nominal,
                                    keterangan: txData.keterangan
                                })
                                .eq('id', txData.id);

                            if (error) throw error;
                            showToast("Transaksi berhasil diperbarui di Supabase!");
                        } catch (err) {
                            console.error("Supabase update error:", err);
                            showToast("Gagal update di Supabase. Disimpan secara lokal.");
                            localStorage.setItem('badminton_transactions', JSON.stringify(updatedList));
                        }
                    } else {
                        localStorage.setItem('badminton_transactions', JSON.stringify(updatedList));
                        showToast("Perubahan tersimpan secara lokal.");
                    }
                } else {
                    const newTx = {
                        id: generateId(),
                        tanggal: txData.tanggal,
                        kategori: txData.kategori,
                        tipe: txData.tipe,
                        nominal: Number(txData.nominal),
                        keterangan: txData.keterangan
                    };
                    updatedList = [newTx, ...transactions];
                    setTransactions(updatedList);

                    if (supabaseClient) {
                        try {
                            const { error } = await supabaseClient
                                .from('transactions')
                                .insert([newTx]);

                            if (error) throw error;
                            showToast("Transaksi baru berhasil disimpan ke Supabase!");
                        } catch (err) {
                            console.error("Supabase insert error:", err);
                            showToast("Gagal simpan ke Supabase. Tersimpan lokal.");
                            localStorage.setItem('badminton_transactions', JSON.stringify(updatedList));
                        }
                    } else {
                        localStorage.setItem('badminton_transactions', JSON.stringify(updatedList));
                        showToast("Tersimpan secara lokal.");
                    }
                }
                setIsAddModalOpen(false);
                setEditingTx(null);
            };

            const handleDelete = async (id) => {
                const updatedList = transactions.filter(t => t.id !== id);
                setTransactions(updatedList);

                if (supabaseClient) {
                    try {
                        const { error } = await supabaseClient
                            .from('transactions')
                            .delete()
                            .eq('id', id);

                        if (error) throw error;
                        showToast("Data transaksi dihapus dari Supabase!");
                    } catch (err) {
                        console.error("Supabase delete error:", err);
                        showToast("Gagal hapus dari Supabase. Terhapus secara lokal.");
                        localStorage.setItem('badminton_transactions', JSON.stringify(updatedList));
                    }
                } else {
                    localStorage.setItem('badminton_transactions', JSON.stringify(updatedList));
                    showToast("Transaksi terhapus (lokal).");
                }
                setTxToDelete(null);
            };

            return (
                <div className="flex h-screen bg-slate-50 text-slate-800 overflow-hidden">
                    {/* Sidebar Desktop */}
                    <aside className="hidden md:flex flex-col w-64 bg-white border-r border-slate-200 shadow-sm z-10">
                        <div className="flex items-center justify-between px-6 h-20 border-b border-slate-100">
                            <div className="flex items-center space-x-3 text-emerald-600 font-bold text-xl">
                                <span className="p-2 bg-emerald-50 rounded-xl">🏸</span>
                                <span>SUKA NEPAK</span>
                            </div>
                        </div>

                        {/* Status Database Indicator */}
                        <div className="px-6 py-3 border-b border-slate-100 bg-slate-50/50 flex items-center justify-between text-xs">
                            <span className="text-slate-500 font-medium">Database:</span>
                            <span className={`px-2 py-0.5 rounded-full font-semibold ${supabaseClient ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}`}>
                                {supabaseClient ? 'Supabase Online' : 'Local Storage'}
                            </span>
                        </div>

                        <nav className="flex-1 overflow-y-auto py-4">
                            <ul className="space-y-1 px-3">
                                {['Dashboard', 'Turnamen', 'Mabar', 'Drilling'].map(tab => (
                                    <li key={tab}>
                                        <button 
                                            onClick={() => setActiveTab(tab)}
                                            className={`w-full flex items-center px-4 py-3 rounded-xl text-sm font-medium transition-all ${activeTab === tab ? 'bg-emerald-500 text-white shadow-md shadow-emerald-500/20' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'}`}
                                        >
                                            <span className="mr-3">{Icons[tab]()}</span>
                                            {tab === 'Mabar' ? 'Mabar (Kamis & Sabtu)' : tab}
                                        </button>
                                    </li>
                                ))}
                            </ul>

                            <div className="px-6 py-4 mt-4 text-xs font-semibold text-slate-400 uppercase tracking-wider">Laporan & Pengaturan</div>
                            <ul className="space-y-1 px-3">
                                <li>
                                    <button onClick={() => setIsExportModalOpen(true)} className="w-full flex items-center px-4 py-2.5 rounded-xl text-sm text-slate-600 hover:bg-slate-100 hover:text-blue-600 transition-colors">
                                        <span className="mr-3">{Icons.Export()}</span> Export PDF
                                    </button>
                                </li>
                                <li>
                                    <button onClick={() => setIsSettingsModalOpen(true)} className="w-full flex items-center px-4 py-2.5 rounded-xl text-sm text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition-colors">
                                        <span className="mr-3">{Icons.Settings()}</span> Config Supabase
                                    </button>
                                </li>
                            </ul>
                        </nav>
                    </aside>

                    {/* Main Area */}
                    <div className="flex-1 flex flex-col h-screen overflow-hidden">
                        {/* Header Mobile */}
                        <header className="md:hidden flex items-center justify-between bg-white px-4 py-3 border-b border-slate-200 z-20">
                            <div className="font-bold text-lg text-emerald-600 flex items-center space-x-2">
                                <span>🏸</span>
                                <span>SUKA NEPAK</span>
                            </div>
                            <div className="flex space-x-1">
                                <button onClick={() => setIsExportModalOpen(true)} className="p-2 text-slate-600 hover:bg-slate-100 rounded-lg" title="Export PDF"><Icons.Export /></button>
                                <button onClick={() => setIsSettingsModalOpen(true)} className="p-2 text-slate-600 hover:bg-slate-100 rounded-lg" title="Config DB"><Icons.Settings /></button>
                            </div>
                        </header>

                        {/* Scroll Content */}
                        <main className="flex-1 overflow-x-hidden overflow-y-auto bg-slate-50 p-4 md:p-8">
                            <div className="max-w-6xl mx-auto space-y-6 fade-in">
                                {isLoading ? (
                                    <div className="flex flex-col justify-center items-center h-64 space-y-3">
                                        <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-emerald-500"></div>
                                        <p className="text-sm text-slate-500">Memuat data dari database...</p>
                                    </div>
                                ) : (
                                    <>
                                        {activeTab === 'Dashboard' && (
                                            <DashboardView 
                                                data={transactions} 
                                                onAdd={() => { setEditingTx(null); setIsAddModalOpen(true); }}
                                                onEdit={(tx) => { setEditingTx(tx); setIsAddModalOpen(true); }}
                                                onDelete={(tx) => setTxToDelete(tx)}
                                                onRefresh={fetchData}
                                            />
                                        )}
                                        {activeTab !== 'Dashboard' && (
                                            <CategoryView 
                                                category={activeTab} 
                                                title={activeTab === 'Mabar' ? 'Keuangan Mabar (Kamis & Sabtu)' : `Keuangan ${activeTab}`}
                                                data={transactions} 
                                                onAdd={() => { setEditingTx(null); setIsAddModalOpen(true); }}
                                                onEdit={(tx) => { setEditingTx(tx); setIsAddModalOpen(true); }}
                                                onDelete={(tx) => setTxToDelete(tx)}
                                            />
                                        )}
                                    </>
                                )}
                            </div>
                        </main>

                        {/* Bottom Bar Navigation Mobile */}
                        <nav className="md:hidden bg-white border-t border-slate-200 flex justify-around p-1 z-20 shadow-lg">
                            {['Dashboard', 'Turnamen', 'Mabar', 'Drilling'].map(tab => (
                                <button 
                                    key={tab} 
                                    onClick={() => setActiveTab(tab)}
                                    className={`flex flex-col items-center justify-center py-2 px-1 rounded-xl text-xs w-full transition-all ${activeTab === tab ? 'text-emerald-600 font-bold bg-emerald-50' : 'text-slate-500'}`}
                                >
                                    <span className="mb-0.5">{Icons[tab]()}</span>
                                    {tab === 'Mabar' ? 'Mabar' : tab}
                                </button>
                            ))}
                        </nav>
                    </div>

                    {/* Modals */}
                    {isAddModalOpen && (
                        <AddTransactionModal 
                            category={activeTab === 'Dashboard' ? 'Turnamen' : activeTab}
                            onClose={() => { setIsAddModalOpen(false); setEditingTx(null); }} 
                            onSave={handleSaveTransaction} 
                            initialData={editingTx}
                        />
                    )}
                    
                    {isExportModalOpen && (
                        <ExportModal 
                            data={transactions}
                            onClose={() => setIsExportModalOpen(false)} 
                        />
                    )}

                    {isSettingsModalOpen && (
                        <SettingsModal 
                            currentUrl={supabaseUrl}
                            currentKey={supabaseKey}
                            onSave={(url, key) => { 
                                setSupabaseUrl(url); 
                                setSupabaseKey(key);
                                localStorage.setItem('supabase_url', url);
                                localStorage.setItem('supabase_key', key);
                                setIsSettingsModalOpen(false);
                                showToast("Konfigurasi Supabase tersimpan.");
                            }}
                            onClose={() => setIsSettingsModalOpen(false)}
                        />
                    )}

                    {txToDelete && (
                        <ConfirmModal 
                            title="Konfirmasi Hapus"
                            message={`Yakin hapus transaksi "${txToDelete.keterangan}" (${formatIDR(txToDelete.nominal)})?`}
                            onConfirm={() => handleDelete(txToDelete.id)}
                            onClose={() => setTxToDelete(null)}
                        />
                    )}

                    {/* Toast Alert */}
                    {toastMsg && (
                        <div className="fixed bottom-20 md:bottom-8 right-1/2 translate-x-1/2 md:translate-x-0 md:right-8 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-xl flex items-center space-x-3 z-50 animate-[fadeIn_0.2s_ease-out] text-sm">
                            <span className="text-emerald-400 font-bold">✓</span>
                            <span>{toastMsg}</span>
                        </div>
                    )}
                </div>
            );
        };

        // --- REUSABLE TABLE WITH SEARCH & PAGINATION ---
        const TransactionTableWithFilter = ({ data, onEdit, onDelete, showCategoryColumn = true }) => {
            const [searchQuery, setSearchQuery] = useState('');
            const [filterCategory, setFilterCategory] = useState('All');
            const [filterTipe, setFilterTipe] = useState('All');
            const [filterDateStart, setFilterDateStart] = useState('');
            const [filterDateEnd, setFilterDateEnd] = useState('');
            
            // Pagination state
            const [currentPage, setCurrentPage] = useState(1);
            const [pageSize, setPageSize] = useState(8);

            // Filter logic (Multi-field Search)
            const filteredData = useMemo(() => {
                return data.filter(item => {
                    // Match Search Query across multiple fields (keterangan, nominal, date)
                    const q = searchQuery.toLowerCase().trim();
                    const matchQuery = !q || 
                        item.keterangan.toLowerCase().includes(q) ||
                        item.kategori.toLowerCase().includes(q) ||
                        item.tanggal.includes(q) ||
                        item.nominal.toString().includes(q);

                    // Match Category
                    const matchCategory = filterCategory === 'All' || item.kategori === filterCategory;

                    // Match Type
                    const matchTipe = filterTipe === 'All' || item.tipe === filterTipe;

                    // Match Date Range
                    let matchDate = true;
                    if (filterDateStart && item.tanggal < filterDateStart) matchDate = false;
                    if (filterDateEnd && item.tanggal > filterDateEnd) matchDate = false;

                    return matchQuery && matchCategory && matchTipe && matchDate;
                });
            }, [data, searchQuery, filterCategory, filterTipe, filterDateStart, filterDateEnd]);

            // Reset page when filters change
            useEffect(() => {
                setCurrentPage(1);
            }, [searchQuery, filterCategory, filterTipe, filterDateStart, filterDateEnd, pageSize]);

            // Paginated slice
            const totalItems = filteredData.length;
            const totalPages = Math.ceil(totalItems / pageSize) || 1;
            const paginatedItems = useMemo(() => {
                const start = (currentPage - 1) * pageSize;
                return filteredData.slice(start, start + pageSize);
            }, [filteredData, currentPage, pageSize]);

            const handleResetFilter = () => {
                setSearchQuery('');
                setFilterCategory('All');
                setFilterTipe('All');
                setFilterDateStart('');
                setFilterDateEnd('');
            };

            return (
                <div className="space-y-4">
                    {/* Search & Filter Bar */}
                    <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                        <div className="flex flex-col md:flex-row gap-3">
                            {/* Search Input */}
                            <div className="relative flex-1">
                                <span className="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                                    <Icons.Search />
                                </span>
                                <input 
                                    type="text" 
                                    placeholder="Cari keterangan, nominal, tanggal..." 
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    className="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all"
                                />
                            </div>

                            {/* Dropdown Filters */}
                            <div className="flex flex-wrap md:flex-nowrap gap-2">
                                {showCategoryColumn && (
                                    <select 
                                        value={filterCategory} 
                                        onChange={(e) => setFilterCategory(e.target.value)}
                                        className="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs md:text-sm text-slate-700 outline-none focus:ring-2 focus:ring-emerald-500"
                                    >
                                        <option value="All">Semua Kategori</option>
                                        <option value="Turnamen">Turnamen</option>
                                        <option value="Mabar">Mabar</option>
                                        <option value="Drilling">Drilling</option>
                                    </select>
                                )}

                                <select 
                                    value={filterTipe} 
                                    onChange={(e) => setFilterTipe(e.target.value)}
                                    className="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs md:text-sm text-slate-700 outline-none focus:ring-2 focus:ring-emerald-500"
                                >
                                    <option value="All">Semua Tipe</option>
                                    <option value="Pemasukan">Pemasukan (+)</option>
                                    <option value="Pengeluaran">Pengeluaran (-)</option>
                                </select>

                                {(searchQuery || filterCategory !== 'All' || filterTipe !== 'All' || filterDateStart || filterDateEnd) && (
                                    <button 
                                        onClick={handleResetFilter} 
                                        className="flex items-center space-x-1 px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-xs font-medium transition-colors"
                                        title="Reset Filter"
                                    >
                                        <Icons.Refresh />
                                        <span className="hidden sm:inline">Reset</span>
                                    </button>
                                )}
                            </div>
                        </div>

                        {/* Date Filter Range */}
                        <div className="flex flex-wrap items-center gap-2 pt-2 border-t border-slate-100 text-xs text-slate-500">
                            <span className="font-semibold flex items-center"><Icons.Filter /> &nbsp;Filter Tanggal:</span>
                            <input 
                                type="date" 
                                value={filterDateStart} 
                                onChange={(e) => setFilterDateStart(e.target.value)} 
                                className="bg-slate-50 border border-slate-200 rounded-lg px-2 py-1 text-xs outline-none"
                            />
                            <span>s/d</span>
                            <input 
                                type="date" 
                                value={filterDateEnd} 
                                onChange={(e) => setFilterDateEnd(e.target.value)} 
                                className="bg-slate-50 border border-slate-200 rounded-lg px-2 py-1 text-xs outline-none"
                            />
                        </div>
                    </div>

                    {/* Table View Desktop & Mobile Responsive Cards */}
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        {/* Table View (Desktop) */}
                        <div className="hidden md:block overflow-x-auto">
                            <table className="w-full text-left text-sm text-slate-600">
                                <thead className="bg-slate-50 text-slate-700 uppercase text-xs font-semibold tracking-wider">
                                    <tr>
                                        <th className="px-6 py-3.5">Tanggal</th>
                                        {showCategoryColumn && <th className="px-6 py-3.5">Kategori</th>}
                                        <th className="px-6 py-3.5">Keterangan</th>
                                        <th className="px-6 py-3.5 text-right">Nominal</th>
                                        <th className="px-6 py-3.5 text-center">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {paginatedItems.length === 0 ? (
                                        <tr>
                                            <td colSpan={showCategoryColumn ? 5 : 4} className="px-6 py-12 text-center text-slate-400">
                                                Tidak ditemukan transaksi yang sesuai filter.
                                            </td>
                                        </tr>
                                    ) : (
                                        paginatedItems.map(item => (
                                            <tr key={item.id} className="hover:bg-slate-50/80 transition-colors">
                                                <td className="px-6 py-4 whitespace-nowrap text-slate-900 font-medium">{formatDate(item.tanggal)}</td>
                                                {showCategoryColumn && (
                                                    <td className="px-6 py-4 whitespace-nowrap">
                                                        <span className="px-2.5 py-1 bg-slate-100 border border-slate-200 rounded-lg text-xs font-medium text-slate-700">
                                                            {item.kategori}
                                                        </span>
                                                    </td>
                                                )}
                                                <td className="px-6 py-4 text-slate-700">{item.keterangan}</td>
                                                <td className={`px-6 py-4 text-right font-bold whitespace-nowrap ${item.tipe === 'Pemasukan' ? 'text-emerald-600' : 'text-rose-600'}`}>
                                                    {item.tipe === 'Pemasukan' ? '+' : '-'}{formatIDR(item.nominal)}
                                                </td>
                                                <td className="px-6 py-4 text-center whitespace-nowrap">
                                                    <div className="flex justify-center items-center space-x-2">
                                                        <button onClick={() => onEdit(item)} className="p-1.5 text-blue-600 hover:bg-blue-50 rounded-lg transition-colors" title="Edit">
                                                            <Icons.Edit />
                                                        </button>
                                                        <button onClick={() => onDelete(item)} className="p-1.5 text-rose-600 hover:bg-rose-50 rounded-lg transition-colors" title="Hapus">
                                                            <Icons.Trash />
                                                        </button>
                                                    </div>
                                                </td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>

                        {/* Card List View (Mobile Optimized) */}
                        <div className="md:hidden divide-y divide-slate-100">
                            {paginatedItems.length === 0 ? (
                                <div className="p-8 text-center text-slate-400 text-sm">
                                    Tidak ditemukan transaksi yang sesuai filter.
                                </div>
                            ) : (
                                paginatedItems.map(item => (
                                    <div key={item.id} className="p-4 space-y-2 hover:bg-slate-50 transition-colors">
                                        <div className="flex justify-between items-start">
                                            <div className="space-y-0.5">
                                                <span className="text-xs text-slate-400 font-medium">{formatDate(item.tanggal)}</span>
                                                {showCategoryColumn && (
                                                    <span className="ml-2 inline-block px-2 py-0.5 bg-slate-100 text-slate-600 rounded text-[10px] font-semibold">
                                                        {item.kategori}
                                                    </span>
                                                )}
                                                <h4 className="font-semibold text-slate-800 text-sm">{item.keterangan}</h4>
                                            </div>
                                            <div className={`text-sm font-bold ${item.tipe === 'Pemasukan' ? 'text-emerald-600' : 'text-rose-600'}`}>
                                                {item.tipe === 'Pemasukan' ? '+' : '-'}{formatIDR(item.nominal)}
                                            </div>
                                        </div>
                                        <div className="flex justify-end items-center space-x-3 pt-1">
                                            <button onClick={() => onEdit(item)} className="text-xs font-semibold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-lg">Edit</button>
                                            <button onClick={() => onDelete(item)} className="text-xs font-semibold text-rose-600 bg-rose-50 px-2.5 py-1 rounded-lg">Hapus</button>
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>

                        {/* Pagination Footer */}
                        <div className="px-6 py-3.5 bg-slate-50/70 border-t border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-slate-500">
                            <div className="flex items-center space-x-2">
                                <span>Tampilkan:</span>
                                <select 
                                    value={pageSize} 
                                    onChange={(e) => setPageSize(Number(e.target.value))}
                                    className="bg-white border border-slate-200 rounded-lg px-2 py-1 outline-none"
                                >
                                    <option value={5}>5</option>
                                    <option value={8}>8</option>
                                    <option value={15}>15</option>
                                    <option value={30}>30</option>
                                </select>
                                <span>dari {totalItems} data</span>
                            </div>

                            <div className="flex items-center space-x-2">
                                <button 
                                    disabled={currentPage === 1}
                                    onClick={() => setCurrentPage(prev => Math.max(prev - 1, 1))}
                                    className="p-1.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed"
                                >
                                    <Icons.ChevronLeft />
                                </button>
                                <span className="font-semibold text-slate-700">Halaman {currentPage} dari {totalPages}</span>
                                <button 
                                    disabled={currentPage === totalPages}
                                    onClick={() => setCurrentPage(prev => Math.min(prev + 1, totalPages))}
                                    className="p-1.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed"
                                >
                                    <Icons.ChevronRight />
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- DASHBOARD VIEW ---
        const DashboardView = ({ data, onAdd, onEdit, onDelete, onRefresh }) => {
            const totals = useMemo(() => {
                let pemasukan = 0, pengeluaran = 0;
                data.forEach(t => {
                    if (t.tipe === 'Pemasukan') pemasukan += t.nominal;
                    else pengeluaran += t.nominal;
                });
                return { pemasukan, pengeluaran, saldo: pemasukan - pengeluaran };
            }, [data]);

            const summaryByCategory = useMemo(() => {
                const cats = ['Turnamen', 'Mabar', 'Drilling'];
                return cats.map(cat => {
                    let pem = 0, peng = 0;
                    data.filter(t => t.kategori === cat).forEach(t => {
                        if (t.tipe === 'Pemasukan') pem += t.nominal; else peng += t.nominal;
                    });
                    return { name: cat, saldo: pem - peng, pemasukan: pem, pengeluaran: peng };
                });
            }, [data]);

            return (
                <div className="space-y-6">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div>
                            <h2 className="text-2xl font-bold text-slate-800">Keseluruhan Kas SUKA NEPAK</h2>
                            <p className="text-slate-500 text-sm">Akumulasi seluruh arus kas (Turnamen, Mabar, & Drilling)</p>
                        </div>
                        <div className="flex space-x-2">
                            <button onClick={onRefresh} className="p-2.5 bg-white border border-slate-200 text-slate-600 rounded-xl hover:bg-slate-100 transition-colors" title="Refresh Data">
                                <Icons.Refresh />
                            </button>
                            <button onClick={onAdd} className="flex items-center space-x-2 bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl font-medium shadow-md shadow-emerald-600/20 transition-all text-sm">
                                <Icons.Plus /> <span>Catat Transaksi</span>
                            </button>
                        </div>
                    </div>

                    {/* Main Cards Summary */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div className="bg-gradient-to-br from-emerald-600 to-teal-700 p-6 rounded-2xl shadow-lg text-white">
                            <span className="text-emerald-100 font-medium text-xs uppercase tracking-wider">Total Saldo Kas Tersisa</span>
                            <div className="text-3xl font-extrabold tracking-tight mt-2">{formatIDR(totals.saldo)}</div>
                        </div>
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                            <div className="flex items-center space-x-3 mb-2">
                                <div className="p-2.5 bg-emerald-50 text-emerald-600 rounded-xl"><Icons.Plus /></div>
                                <span className="text-slate-500 font-medium text-xs uppercase tracking-wider">Total Pemasukan</span>
                            </div>
                            <div className="text-2xl font-bold text-slate-800">{formatIDR(totals.pemasukan)}</div>
                        </div>
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                            <div className="flex items-center space-x-3 mb-2">
                                <div className="p-2.5 bg-rose-50 text-rose-600 rounded-xl"><Icons.Trash /></div>
                                <span className="text-slate-500 font-medium text-xs uppercase tracking-wider">Total Pengeluaran</span>
                            </div>
                            <div className="text-2xl font-bold text-slate-800">{formatIDR(totals.pengeluaran)}</div>
                        </div>
                    </div>

                    {/* Rincian Saldo Per Kategori */}
                    <div className="space-y-3">
                        <h3 className="text-base font-bold text-slate-800">Ringkasan per Kategori</h3>
                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                            {summaryByCategory.map((cat, idx) => (
                                <div key={idx} className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-2">
                                    <div className="flex justify-between items-center">
                                        <span className="font-semibold text-slate-700 text-sm">{cat.name === 'Mabar' ? 'Mabar Rutin' : cat.name}</span>
                                        <span className={`text-xs font-bold px-2 py-0.5 rounded-full ${cat.saldo >= 0 ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-700'}`}>
                                            Net: {formatIDR(cat.saldo)}
                                        </span>
                                    </div>
                                    <div className="text-xs text-slate-500 flex justify-between border-t border-slate-100 pt-2">
                                        <span>Masuk: <b className="text-emerald-600">{formatIDR(cat.pemasukan)}</b></span>
                                        <span>Keluar: <b className="text-rose-600">{formatIDR(cat.pengeluaran)}</b></span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Tabel Transaksi dengan Filter & Search */}
                    <div className="space-y-3">
                        <h3 className="text-base font-bold text-slate-800">Daftar Transaksi Kas</h3>
                        <TransactionTableWithFilter 
                            data={data} 
                            onEdit={onEdit} 
                            onDelete={onDelete} 
                            showCategoryColumn={true}
                        />
                    </div>
                </div>
            );
        };

        // --- CATEGORY VIEW ---
        const CategoryView = ({ category, title, data, onAdd, onEdit, onDelete }) => {
            const categoryData = useMemo(() => {
                return data.filter(t => t.kategori === category);
            }, [data, category]);

            const totals = useMemo(() => {
                let pemasukan = 0, pengeluaran = 0;
                categoryData.forEach(t => {
                    if (t.tipe === 'Pemasukan') pemasukan += t.nominal;
                    else pengeluaran += t.nominal;
                });
                return { pemasukan, pengeluaran, saldo: pemasukan - pengeluaran };
            }, [categoryData]);

            // Saldo global disinkronkan di semua panel
            const globalSaldo = useMemo(() => {
                let pem = 0, peng = 0;
                data.forEach(t => {
                    if (t.tipe === 'Pemasukan') pem += t.nominal;
                    else peng += t.nominal;
                });
                return pem - peng;
            }, [data]);

            return (
                <div className="space-y-6 fade-in">
                    <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-4">
                        <div>
                            <h2 className="text-2xl font-bold text-slate-800">{title}</h2>
                            <p className="text-slate-500 text-sm">Pencatatan khusus untuk pos {category.toLowerCase()}.</p>
                        </div>
                        <button onClick={onAdd} className="flex items-center justify-center space-x-2 bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl font-medium shadow-md shadow-emerald-600/20 transition-colors text-sm">
                            <Icons.Plus /> <span>Tambah Transaksi</span>
                        </button>
                    </div>

                    {/* Summary Cards */}
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 md:gap-4">
                        <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                            <span className="text-xs text-slate-500 font-medium">Pemasukan ({category})</span>
                            <div className="text-xl font-bold text-emerald-600 mt-1">{formatIDR(totals.pemasukan)}</div>
                        </div>
                        <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                            <span className="text-xs text-slate-500 font-medium">Pengeluaran ({category})</span>
                            <div className="text-xl font-bold text-rose-600 mt-1">{formatIDR(totals.pengeluaran)}</div>
                        </div>
                        <div className="bg-emerald-500 p-4 rounded-2xl shadow-md text-white">
                            <span className="text-xs text-emerald-100 font-medium">Saldo Kas Keseluruhan (Synced)</span>
                            <div className="text-xl font-bold mt-1">{formatIDR(globalSaldo)}</div>
                        </div>
                    </div>

                    {/* Tabel Transaksi Kategori */}
                    <TransactionTableWithFilter 
                        data={categoryData} 
                        onEdit={onEdit} 
                        onDelete={onDelete} 
                        showCategoryColumn={false}
                    />
                </div>
            );
        };

        // --- ADD / EDIT TRANSACTION MODAL ---
        const AddTransactionModal = ({ category, onClose, onSave, initialData }) => {
            const [formData, setFormData] = useState(initialData || {
                tanggal: new Date().toISOString().split('T')[0],
                kategori: category || 'Turnamen',
                tipe: 'Pemasukan',
                nominal: '',
                keterangan: ''
            });
            const [error, setError] = useState('');

            const isEditMode = !!initialData;

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!formData.nominal || formData.nominal <= 0) {
                    setError("Nominal harus diisi dengan angka positif.");
                    return;
                }
                if (!formData.keterangan.trim()) {
                    setError("Keterangan transaksi tidak boleh kosong.");
                    return;
                }
                setError('');
                onSave(formData, isEditMode);
            };

            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 fade-in">
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
                        <div className="flex justify-between items-center px-6 py-4 border-b border-slate-100">
                            <h3 className="font-bold text-lg text-slate-800">{isEditMode ? 'Edit Transaksi' : 'Catat Transaksi Baru'}</h3>
                            <button onClick={onClose} className="p-1 text-slate-400 hover:text-slate-600 rounded-lg"><Icons.Close /></button>
                        </div>
                        <form onSubmit={handleSubmit} className="p-6 space-y-4 text-sm">
                            {error && <div className="p-3 bg-rose-50 text-rose-600 border border-rose-200 rounded-xl text-xs">{error}</div>}
                            
                            <div>
                                <label className="block font-medium text-slate-700 mb-1">Tipe Transaksi</label>
                                <div className="grid grid-cols-2 gap-3">
                                    <button 
                                        type="button" 
                                        onClick={() => setFormData({...formData, tipe: 'Pemasukan'})} 
                                        className={`py-2 rounded-xl border font-semibold transition-all ${formData.tipe === 'Pemasukan' ? 'border-emerald-500 bg-emerald-50 text-emerald-700' : 'border-slate-200 text-slate-500 hover:bg-slate-50'}`}
                                    >
                                        + Pemasukan
                                    </button>
                                    <button 
                                        type="button" 
                                        onClick={() => setFormData({...formData, tipe: 'Pengeluaran'})} 
                                        className={`py-2 rounded-xl border font-semibold transition-all ${formData.tipe === 'Pengeluaran' ? 'border-rose-500 bg-rose-50 text-rose-700' : 'border-slate-200 text-slate-500 hover:bg-slate-50'}`}
                                    >
                                        - Pengeluaran
                                    </button>
                                </div>
                            </div>

                            <div>
                                <label className="block font-medium text-slate-700 mb-1">Kategori Pos</label>
                                <select 
                                    value={formData.kategori} 
                                    onChange={(e) => setFormData({...formData, kategori: e.target.value})} 
                                    className="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 focus:ring-2 focus:ring-emerald-500 outline-none"
                                >
                                    <option value="Turnamen">Turnamen</option>
                                    <option value="Mabar">Mabar (Kamis & Sabtu)</option>
                                    <option value="Drilling">Drilling</option>
                                </select>
                            </div>

                            <div>
                                <label className="block font-medium text-slate-700 mb-1">Tanggal</label>
                                <input 
                                    type="date" 
                                    required 
                                    value={formData.tanggal} 
                                    onChange={(e) => setFormData({...formData, tanggal: e.target.value})} 
                                    className="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 focus:ring-2 focus:ring-emerald-500 outline-none"
                                />
                            </div>

                            <div>
                                <label className="block font-medium text-slate-700 mb-1">Keterangan / Deskripsi</label>
                                <input 
                                    type="text" 
                                    required 
                                    placeholder="Contoh: Sewa lapangan GOR 2 jam" 
                                    value={formData.keterangan} 
                                    onChange={(e) => setFormData({...formData, keterangan: e.target.value})} 
                                    className="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 focus:ring-2 focus:ring-emerald-500 outline-none"
                                />
                            </div>

                            <div>
                                <label className="block font-medium text-slate-700 mb-1">Nominal (Rp)</label>
                                <input 
                                    type="number" 
                                    required 
                                    placeholder="50000" 
                                    value={formData.nominal} 
                                    onChange={(e) => setFormData({...formData, nominal: e.target.value})} 
                                    className="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 focus:ring-2 focus:ring-emerald-500 outline-none"
                                />
                            </div>

                            <div className="pt-2">
                                <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl shadow-md transition-colors">
                                    {isEditMode ? 'Simpan Perubahan' : 'Simpan Transaksi'}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        // --- EXPORT MODAL ---
        const ExportModal = ({ data, onClose }) => {
            const [rangeType, setRangeType] = useState('Harian');
            const [customStart, setCustomStart] = useState('');
            const [customEnd, setCustomEnd] = useState('');
            const [error, setError] = useState('');

            const getToday = () => new Date().toISOString().split('T')[0];
            const getStartOfWeek = () => {
                const d = new Date();
                const day = d.getDay() || 7; 
                if (day !== 1) d.setHours(-24 * (day - 1)); 
                return d.toISOString().split('T')[0];
            };
            const getStartOfMonth = () => {
                const d = new Date();
                return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2, '0')}-01`;
            };

            const handleExport = () => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                
                let filteredData = [...data];
                let titlePeriode = "";
                const today = getToday();

                if (rangeType === 'Harian') {
                    filteredData = data.filter(t => t.tanggal === today);
                    titlePeriode = `Periode: ${formatDate(today)}`;
                } else if (rangeType === 'Mingguan') {
                    const start = getStartOfWeek();
                    filteredData = data.filter(t => t.tanggal >= start && t.tanggal <= today);
                    titlePeriode = `Periode: ${formatDate(start)} s/d ${formatDate(today)}`;
                } else if (rangeType === 'Bulanan') {
                    const start = getStartOfMonth();
                    filteredData = data.filter(t => t.tanggal >= start && t.tanggal <= today);
                    titlePeriode = `Bulan: ${new Date().toLocaleDateString('id-ID', { month: 'long', year: 'numeric' })}`;
                } else if (rangeType === 'Custom') {
                    if (!customStart || !customEnd) {
                        setError("Harap tentukan tanggal awal dan akhir.");
                        return;
                    }
                    filteredData = data.filter(t => t.tanggal >= customStart && t.tanggal <= customEnd);
                    titlePeriode = `Periode: ${formatDate(customStart)} s/d ${formatDate(customEnd)}`;
                }

                filteredData.sort((a, b) => new Date(a.tanggal) - new Date(b.tanggal));

                let totalPemasukan = 0, totalPengeluaran = 0;
                const tableBody = filteredData.map(t => {
                    if (t.tipe === 'Pemasukan') totalPemasukan += t.nominal;
                    else totalPengeluaran += t.nominal;
                    
                    return [
                        formatDate(t.tanggal),
                        t.kategori,
                        t.keterangan,
                        t.tipe === 'Pemasukan' ? formatIDR(t.nominal) : '-',
                        t.tipe === 'Pengeluaran' ? formatIDR(t.nominal) : '-'
                    ];
                });

                doc.setFontSize(16);
                doc.text("Laporan Keuangan Kas Badminton", 14, 15);
                doc.setFontSize(10);
                doc.setTextColor(100);
                doc.text(titlePeriode, 14, 22);

                doc.autoTable({
                    startY: 28,
                    head: [['Tanggal', 'Kategori', 'Keterangan', 'Pemasukan', 'Pengeluaran']],
                    body: tableBody,
                    foot: [
                        [{ content: 'Total', colSpan: 3, styles: { halign: 'right', fontStyle: 'bold' } }, 
                         { content: formatIDR(totalPemasukan), styles: { fontStyle: 'bold', textColor: [16, 185, 129] } },
                         { content: formatIDR(totalPengeluaran), styles: { fontStyle: 'bold', textColor: [225, 29, 72] } }
                        ],
                        [{ content: 'Saldo Kas Tersisa', colSpan: 3, styles: { halign: 'right', fontStyle: 'bold' } }, 
                         { content: formatIDR(totalPemasukan - totalPengeluaran), colSpan: 2, styles: { fontStyle: 'bold', halign: 'center' } }
                        ]
                    ],
                    theme: 'grid',
                    headStyles: { fillColor: [16, 185, 129] },
                    styles: { fontSize: 9 }
                });

                doc.save(`Laporan_Kas_${rangeType}_${getToday()}.pdf`);
                onClose();
            };

            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 fade-in">
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
                        <div className="flex justify-between items-center px-6 py-4 border-b border-slate-100">
                            <h3 className="font-bold text-lg text-slate-800">Export Laporan PDF</h3>
                            <button onClick={onClose} className="p-1 text-slate-400 hover:text-slate-600 rounded-lg"><Icons.Close /></button>
                        </div>
                        <div className="p-6 space-y-4 text-sm">
                            <div>
                                <label className="block font-medium text-slate-700 mb-2">Rentang Waktu Laporan</label>
                                <div className="grid grid-cols-2 gap-2">
                                    {['Harian', 'Mingguan', 'Bulanan', 'Custom'].map(type => (
                                        <button 
                                            key={type}
                                            onClick={() => { setRangeType(type); setError(''); }} 
                                            className={`py-2 rounded-xl border font-semibold transition-all ${rangeType === type ? 'border-emerald-500 bg-emerald-50 text-emerald-700' : 'border-slate-200 text-slate-500 hover:bg-slate-50'}`}
                                        >
                                            {type}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {error && <div className="p-2 bg-rose-50 text-rose-600 rounded-lg text-xs">{error}</div>}

                            {rangeType === 'Custom' && (
                                <div className="grid grid-cols-2 gap-3 p-3 bg-slate-50 rounded-xl border border-slate-200">
                                    <div>
                                        <label className="block text-xs font-medium text-slate-500 mb-1">Dari Tanggal</label>
                                        <input type="date" value={customStart} onChange={e => setCustomStart(e.target.value)} className="w-full border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs outline-none bg-white"/>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-medium text-slate-500 mb-1">Sampai Tanggal</label>
                                        <input type="date" value={customEnd} onChange={e => setCustomEnd(e.target.value)} className="w-full border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs outline-none bg-white"/>
                                    </div>
                                </div>
                            )}

                            <div className="pt-2">
                                <button onClick={handleExport} className="w-full flex items-center justify-center space-x-2 bg-slate-800 hover:bg-slate-900 text-white font-semibold py-3 rounded-xl transition-colors">
                                    <Icons.Export /> <span>Unduh PDF</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- CONFIRM MODAL ---
        const ConfirmModal = ({ title, message, onConfirm, onClose }) => {
            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 fade-in">
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden text-center p-6 space-y-4">
                        <div className="w-14 h-14 bg-rose-50 text-rose-500 rounded-full flex items-center justify-center mx-auto border border-rose-100">
                            <Icons.Trash />
                        </div>
                        <h3 className="font-bold text-xl text-slate-800">{title}</h3>
                        <p className="text-slate-500 text-sm">{message}</p>
                        <div className="grid grid-cols-2 gap-3 pt-2">
                            <button onClick={onClose} className="py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl transition-colors">Batal</button>
                            <button onClick={onConfirm} className="py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-semibold rounded-xl transition-colors shadow-md">Hapus</button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- CONFIGURATION MODAL (SUPABASE) ---
        const SettingsModal = ({ currentUrl, currentKey, onSave, onClose }) => {
            const [url, setUrl] = useState(currentUrl);
            const [key, setKey] = useState(currentKey);

            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 fade-in">
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden flex flex-col max-h-[90vh]">
                        <div className="flex justify-between items-center px-6 py-4 border-b border-slate-100">
                            <div className="flex items-center space-x-2">
                                <span className="text-emerald-600"><Icons.Database /></span>
                                <h3 className="font-bold text-lg text-slate-800">Konfigurasi Database Supabase</h3>
                            </div>
                            <button onClick={onClose} className="p-1 text-slate-400 hover:text-slate-600 rounded-lg"><Icons.Close /></button>
                        </div>
                        <div className="p-6 overflow-y-auto space-y-4 text-sm">
                            <div className="bg-emerald-50 text-emerald-900 p-4 rounded-xl border border-emerald-200 text-xs leading-relaxed space-y-1">
                                <p className="font-bold text-emerald-800 text-sm">⚡ Langkah Koneksi Supabase:</p>
                                <ol className="list-decimal pl-4 space-y-1">
                                    <li>Buka <b>supabase.com</b> dan buat Project baru.</li>
                                    <li>Jalankan skema tabel SQL di SQL Editor Supabase (tersedia di Readme).</li>
                                    <li>Buka <b>Project Settings &gt; API</b> di Dashboard Supabase.</li>
                                    <li>Salin <b>Project URL</b> dan <b>anon / public key</b> ke form di bawah ini.</li>
                                </ol>
                            </div>

                            <div>
                                <label className="block font-medium text-slate-700 mb-1">Supabase URL</label>
                                <input 
                                    type="url" 
                                    placeholder="https://xxxx.supabase.co" 
                                    value={url} 
                                    onChange={(e) => setUrl(e.target.value)} 
                                    className="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 focus:ring-2 focus:ring-emerald-500 outline-none"
                                />
                            </div>

                            <div>
                                <label className="block font-medium text-slate-700 mb-1">Supabase Anon Key</label>
                                <textarea 
                                    rows="3"
                                    placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." 
                                    value={key} 
                                    onChange={(e) => setKey(e.target.value)} 
                                    className="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 focus:ring-2 focus:ring-emerald-500 outline-none font-mono text-xs"
                                />
                            </div>
                            <p className="text-xs text-slate-400">Jika dikosongkan, aplikasi akan kembali menggunakan penyimpanan internal browser (Local Storage).</p>
                        </div>
                        <div className="px-6 py-4 border-t border-slate-100 bg-slate-50">
                            <button onClick={() => onSave(url.trim(), key.trim())} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl transition-colors shadow-md">
                                Simpan & Koneksikan
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
